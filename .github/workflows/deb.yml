name: deb

# The VitruvianOS .debs, amd64 and arm64, each built natively in a Debian trixie container
# (VitruvianOS 0.6's userland, glibc 2.41) on GitHub's ubuntu-24.04 / ubuntu-24.04-arm
# runners. The link-time V\OS SDK is built from tools/vos-sdk/ and cached per architecture;
# VLC's own build dependencies are Debian's (apt-get build-dep vlc).
# On request only: it never runs on a tag. VitruvianOS isn't one of the regular release
# platforms, so a tested .deb is attached to a release by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 180
    steps:
      - name: Install build dependencies
        run: |
          echo "deb-src http://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/src.list
          apt-get update
          # The V\OS SDK's build deps (VitruvianOS's ccpp-arm64.yml, minus image tooling and the
          # kits the link-only patch leaves out), packaging tools, and VLC's own build deps.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git curl file python3 attr dpkg-dev gh \
            cmake ninja-build build-essential bison flex libfl-dev m4 pkg-config \
            zlib1g-dev libicu-dev libfreetype6-dev libpng-dev libjpeg-dev libgif-dev \
            libtiff-dev libwebp-dev libicns-dev libopenexr-dev libdrm-dev libinput-dev \
            libevdev-dev libseat-dev libelf-dev libncurses-dev libpam0g-dev libglib2.0-dev \
            libudev-dev libsystemd-dev libblkid-dev libxkbcommon-dev libgl-dev libegl-dev \
            autoconf automake libtool gettext
          DEBIAN_FRONTEND=noninteractive apt-get build-dep -y vlc

      - uses: actions/checkout@v4

      - name: App settings
        id: app
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . ./haiku-app.env
          echo "file=${APP_CMD}_${VERSION}-${REVISION}_${{ matrix.arch }}.deb" >> "$GITHUB_OUTPUT"

      # Restored and saved separately, so a failure in a later step keeps it.
      - name: Restore V\OS SDK
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: /opt/vos-sdk
          key: vos-sdk-0.6.2-${{ matrix.arch }}-${{ hashFiles('tools/vos-sdk/*') }}-debian-trixie

      - name: Build V\OS SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: sh tools/vos-sdk/make-sdk.sh /opt/vos-sdk

      - name: Save V\OS SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/vos-sdk
          key: ${{ steps.sdk.outputs.cache-primary-key }}

      - name: Build .deb
        run: |
          . /opt/vos-sdk/sdk/env.sh
          sh packaging/build-deb.sh
          ls -l ${{ steps.app.outputs.file }}
          dpkg-deb -I ${{ steps.app.outputs.file }}
          file obj/deb/*/system/apps/VLC
          echo "glibc needed: $(find obj/deb -type f -name '*.so*' -o -type f -path '*/system/apps/*' | xargs objdump -T 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ steps.app.outputs.file }}

